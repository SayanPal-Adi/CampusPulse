
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f6f0">

    <title>Create Account | CampusPulse</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/campuspulse-theme.css') }}">
</head>

<body data-page="register">

    <header class="register-header">
        <a href="{{ url_for('home') }}" class="register-logo">
            CampusPulse
        </a>

        <a href="{{ url_for('login_page') }}" class="login-link">
            Already have an account? Log in
        </a>
    </header>

    <main class="register-container">

        <section class="register-card">

            <div class="register-heading">
                <p class="register-eyebrow">JOIN THE CAMPUS COMMUNITY</p>

                <h1>Create your account</h1>

                <p>
                    Discover campus events, connect with students,
                    and participate in activities.
                </p>
            </div>

            <form id="registerForm" method="POST"
                action="{{ url_for('auth.register') }}">

                <div class="form-group">
                    <label for="full_name">Full Name</label>

                    <input type="text" id="full_name" name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email" id="email" name="email"
                        placeholder="Enter your email address"
                        autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password"
                        placeholder="Create a password"
                        autocomplete="new-password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>

                    <input type="password" id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="role">I want to register as</label>

                    <select id="role" name="role" required>
                        <option value="" disabled selected>
                            Select account type
                        </option>

                        <option value="student">Student</option>
                        <option value="organizer">Event Organizer</option>
                    </select>
                </div>

                <button type="submit" class="register-submit">
                    Create Account
                </button>

                <p class="register-login">
                    Already registered?
                    <a href="{{ url_for('login_page') }}">Log in</a>
                </p>

            </form>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/register.js') }}" defer></script>

</body>
</html>
