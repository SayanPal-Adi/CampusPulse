
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f6f0">

    <title>Student Login | CampusPulse</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <header class="login-header">
        <a href="{{ url_for('home') }}" class="login-logo">
            CampusPulse
        </a>

        <a href="{{ url_for('register_page') }}" class="login-register-link">
            Create an account
        </a>
    </header>

    <main class="login-container">

        <section class="login-card">

            <div class="login-heading">
                <p class="login-eyebrow">WELCOME BACK</p>

                <h1>Good to see you.</h1>

                <p>
                    Log in to view your campus events
                    and registrations.
                </p>
            </div>

            <form id="loginForm">

                <div class="login-form-group">
                    <label for="email">Email address</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email address"
                        autocomplete="username"
                        required>
                </div>

                <div class="login-form-group">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" id="loginButton" class="login-submit">
                    Log in
                </button>

                <div id="message" class="login-message"
                    role="status" aria-live="polite"></div>

                <p class="login-register">
                    Don't have an account?
                    <a href="{{ url_for('register_page') }}">Create one</a>
                </p>

            </form>

        </section>

    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "";
            message.className = "login-message";

            button.disabled = true;
            button.textContent = "Logging in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: form.email.value.trim(),
                        password: form.password.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Login failed.");
                }

                const dashboardRoutes = {
                    student: "/student-dashboard",
                    organizer: "/organizer-dashboard",
                    admin: "/admin-dashboard"
                };

                const dashboardUrl = dashboardRoutes[data.user.role];

                if (!dashboardUrl) {
                    await fetch("/api/auth/logout", {
                        method: "POST",
                        credentials: "same-origin"
                    });

                    throw new Error("Invalid account role.");
                }

                window.location.href = dashboardUrl;

            } catch (error) {
                message.textContent = error.message;
                message.classList.add("is-error");

            } finally {
                button.disabled = false;
                button.textContent = "Log in";
            }
        });
    </script>

</body>
</html>
