
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | CampusPulse</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f6f7f5;
            color: #25312b;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: min(420px, 100%);
            padding: 32px;
            background: white;
            border: 1px solid #e3e7e3;
            border-radius: 14px;
        }

        h1 { margin-top: 0; color: #315c4c; }
        p { color: #737c76; line-height: 1.5; }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dcd6;
            border-radius: 8px;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #315c4c;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        #message {
            margin-top: 16px;
            color: #a43f3f;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>CampusPulse</h1>
        <p>Log in to view your campus events and registrations.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit" id="loginButton">Log in</button>
            <div id="message" role="status" aria-live="polite"></div>
        </form>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";
            button.disabled = true;
            button.textContent = "Logging in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: form.email.value.trim(),
                        password: form.password.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Login failed.");
                }

                if (data.user.role !== "student") {
                    await fetch("/api/auth/logout", {
                        method: "POST",
                        credentials: "same-origin"
                    });
                    throw new Error("Please use a student account.");
                }

                window.location.href = "/student-dashboard";
            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Log in";
            }
        });
    </script>
</body>
</html>
